name: Bug Report
description: Report a bug in Duplicate Finding Tool
labels: ["bug"]
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
      placeholder: "Describe what's happening..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue
      placeholder: |
        1. Run this command...
        2. Pass this file...
        3. See the error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen
      placeholder: "The program should..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens
      placeholder: "Instead, the program..."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your system details
      placeholder: |
        - OS: [e.g., macOS 12, Ubuntu 22.04, Windows 11]
        - Python version: [e.g., 3.9, 3.10, 3.11]
        - Package version: [e.g., 0.1.0]
      value: |
        - OS: 
        - Python version: 
        - Package version: 

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information (optional)
      placeholder: "Error output, logs, screenshots, etc..."
    validations:
      required: false
